version: 2

models:
  - name: stg_customers
    description: "Customers cleaned and typed from bronze"
    tests:
      - dbt_utils.expression_is_true:
          expression: "length(customer_zip_code_prefix) = 5"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer (PK)"
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Identifier for each customer (in their multiple orders)"
        tests:
          - not_null
      - name: customer_zip_code_prefix
        description: "First five digits of the zip code"
        tests:
          - not_null
      - name: customer_state
        description: "27 states of Brazil"
        tests:
          - accepted_values:
              values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']

  - name: stg_geolocation
    description: "Geospatial data of the cities"
    tests:
      - dbt_utils.expression_is_true:
          expression: "length(geolocation_zip_code_prefix) = 5"
    columns: 
      - name: geolocation_zip_code_prefix
        description: "First five digits of the zip code"
        tests:
          - not_null
      - name: geolocation_state
        description: "27 states of Brazil"
        tests:
          - accepted_values:
              values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']

  - name: stg_order_items
    description: "The items that contains each order"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_id
      - dbt_utils.expression_is_true:
          expression: 'price >= 0'
      - dbt_utils.expression_is_true:
          expression: 'freight_value >= 0'            
    columns:
      - name: order_id
        description: "Unique identifier for each order (FK)"
        tests:
        - not_null
        - relationships:
            to: ref('stg_orders')
            field: order_id
      - name: order_item_id
        description: "Identifier for each product inside an order (FK)"
        tests:
          - not_null
      - name: product_id
        description: "Identifier for each product (FK)"
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        description: "Identifier for each seller (FK)"
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id

  - name: stg_order_payments
    description: "Payments of the orders"
    columns:
      - name: order_id
        description: "Unique identifier for each order (FK)"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_type
        description: "How payed the order"
        tests:
          - accepted_values:
              values: ['credit_card','boleto','voucher','debit_card','not_defined']

  - name: stg_order_reviews
    description: "Reviews of the orders compose PK (review_id + order_id)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - review_id
            - order_id
    columns:
      - name: review_id
        description: "Unique identifier for each review"
        tests:
          - not_null
      - name: order_id
        description: "Identifier for each order"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: review_score
        description: "Score of the order"
        tests:
          - accepted_values:
              values: [1,2,3,4,5]

  - name: stg_orders
    description: "Orders cleaned and typed from bronze"
    columns:
      - name: order_id
        description: "Unique identifier for order (PK)"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer that make the order"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        description: "Status of the order (delivered, shipped, canceled, etc.)"
        tests:
          - accepted_values:
              values: ['delivered','shipped','canceled','invoiced','processing','unavailable','approved','created']

  - name: stg_products
    description: "Products data"
    columns:
      - name: product_id
        description: "Unique identifier for each product (PK)"
        tests:
          - unique
          - not_null

  - name: stg_sellers
    description: "Seller data"
    tests:
      - dbt_utils.expression_is_true:
          expression: "length(seller_zip_code_prefix) = 5"
    columns:
      - name: seller_id
        description: "Unique identifier for each seller (PK)"
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: "First five digits of the zip code of the seller"
        tests:
          - not_null
      - name: seller_state
        description: "27 states of Brazil"
        tests:
          - accepted_values:
              values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']