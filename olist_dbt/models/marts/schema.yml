version: 2

models:
  - name: dim_customer
    description: "Customer dimension, one row per customer_id"
    columns:
      - name: customer_id
        description: "Unique identifier (PK)"
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - not_null
      - name: customer_zip_code_prefix
        description: "First five digits, ~157 customers have a zip code prefix without matching coordinates in dim_geolocation"
        tests:
          - not_null
          - relationships:
              to: ref('dim_geolocation')
              field: geolocation_zip_code_prefix
              config:
                severity: warn
      - name: customer_city
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
          - accepted_values:
              values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']

  - name: dim_date
    description: "Date dimension, one row per date_key"
    columns:
      - name: date_key
        description: "Unique identifier (PK) (YYYYMMDD) for all the operative days"
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: month
        tests: 
          - not_null
      - name: day
        tests:
          - not_null
      - name: quarter
        tests:
          - not_null
      - name: day_of_week
        tests:
          - not_null
      - name: day_name
        tests:
          - not_null
      - name: month_name
        tests:
          - not_null
      - name: is_weekend
        tests:
          - not_null

  - name: dim_geolocation
    description: "Geolocation dimension, one row per geolocation_zip_code_prefix"
    columns:
      - name: geolocation_zip_code_prefix
        description: "Unique identifier (PK)"
        tests:
          - unique
          - not_null
      - name: avg_lat
        tests:
          - not_null
      - name: avg_lng
        tests:
          - not_null
      - name: geolocation_city
        tests:
          - not_null
      - name: geolocation_state
        tests:
          - not_null
          - accepted_values:
              values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']
            
  - name: dim_product
    description: "Product dimension, one row per product_id"
    columns:
      - name: product_id
        description: "Unique identifier (PK)"
        tests:
          - unique
          - not_null
      - name: product_category_name
        tests:
          - not_null
      - name: product_category_name_english
        tests:
          - not_null
      - name: product_weight_g
        description: "It has 2 null values"
      - name: product_length_cm
        description: "It has 2 null values that propagates to the volume"
      - name: product_height_cm
        description: "It has 2 null values that propagates to the volume"
      - name: product_width_cm
        description: "It has 2 null values that propagates to the volume"
      - name: product_volume_cm3
        description: "It has 2 null values that derives from the length, height and width"
  
  - name: dim_seller
    description: "Seller dimension, one row per seller_id"
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: "First five digits, ~ customers have a zip code prefix without matching coordinates in dim_geolocation"
        tests:
          - not_null
          - relationships:
              to: ref('dim_geolocation')
              field: geolocation_zip_code_prefix
              config: 
                severity: warn
      - name: seller_city
        tests:
          - not_null
      - name: seller_state
        tests:
          - not_null
          - accepted_values:
              values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']
  
  - name: fact_order_items
    description: "Order line items  one row per product within an order (grain: order_id + order_item_id)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_id
    columns:
      - name: order_id
        description: "Order this item belongs to (FK)"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        description: "Sequential identifier for each item within the order"
        tests:
          - not_null
      - name: product_id
        description: "Product sold in this line item (FK)"
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: seller_id
        description: "Seller who sold this item (FK)"
        tests:
          - not_null
          - relationships:
              to: ref('dim_seller')
              field: seller_id
      - name: seller_zip_code_prefix
        description: "Seller zip code (FK) to dim_geolocation"
        tests:
          - not_null
          - relationships:
              to: ref('dim_geolocation')
              field: geolocation_zip_code_prefix
              config:
                severity: warn
      - name: customer_id
        description: "Customer who placed the order (FK)"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: customer_zip_code_prefix
        description: "Customer zip code (FK) to dim_geolocation"
        tests:
          - not_null
          - relationships:
              to: ref('dim_geolocation')
              field: geolocation_zip_code_prefix
              config:
                severity: warn            
      - name: price
        description: "Item price"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: freight_value
        description: "Shipping cost for this item"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: purchase_date_key
        description: "FK to dim_date  date the order was purchased"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: approved_date_key
        description: "FK to dim_date  date the order was approved (nullable: not all orders reach this status)"
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
              config:
                severity: warn
      - name: delivered_carrier_date_key
        description: "FK to dim_date  date handed to carrier (nullable)"
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
              config:
                severity: warn
      - name: delivered_customer_date_key
        description: "FK to dim_date  date delivered to customer (nullable: order may not be delivered yet)"
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
              config:
                severity: warn
      - name: estimated_delivery_date_key
        description: "FK to dim_date estimated delivery date"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
  
  - name: fact_payments
    description: "Payment events one row per payment method used within an order (grain: order_id + payment_sequential)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - payment_sequential
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: customer_id
        description: "Customer who paid"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: purchase_date_key
        description: "FK to dim_date"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: payment_type
        tests:
          - accepted_values:
              values: ['credit_card','boleto','voucher','debit_card','not_defined']
      - name: payment_installments
        description: "Tells the fixed installments"
        tests:
          - not_null
      - name: payment_value
        description: "Total payment of the order"
        tests:
          - not_null
  
  - name: fact_reviews
    description: "Review events one row per review associated with an order (grain: review_id + order_id)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - review_id
            - order_id
    columns:
      - name: review_id
        description: "Identifier for the review"
        tests:
          - not_null
      - name: order_id
        description: "Order this review belongs to (FK)"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: customer_id
        description: "Customer that let the review"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: review_date_key
        description: "FK to dim_date"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: review_score
        description: "Score given by the customer, from 1 (worst) to 5 (best)"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: review_comment_title
        description: "Free-text title of the review; can be null when the customer left no title"
      - name: review_comment_message
        description: "Free-text body of the review; can be null when the customer left no comment"
      - name: review_creation_ts
        description: "Timestamp when the review was created"
        tests:
          - not_null
      - name: review_answer_ts
        description: "Timestamp when Olist responded to the review"
        tests:
          - not_null